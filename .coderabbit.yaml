# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "fr-FR"
tone_instructions: "Tu es un expert senior en React, TypeScript, PWA et Supabase. Réalise une revue de code détaillée, bienveillante et orientée production en français. Analyse la sécurité, l'architecture offline-first avec Dexie, la gestion des erreurs et les performances."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

chat:
  auto_reply: true
